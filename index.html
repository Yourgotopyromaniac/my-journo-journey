<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A 24-week digital journalism course, made for Princess." />
    <title>My Journo Journey</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mjj-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var s = localStorage.getItem('mjj-text-size')
        if (s) document.documentElement.dataset.textSize = s
      } catch (e) {}

      // Catch Chrome's install offer as early as possible. It can fire before the app has loaded,
      // and it only fires once per page load, so it is stored here for the app to use later.
      window.__installPrompt = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__installPrompt = e
        window.dispatchEvent(new Event('mjj-install-ready'))
      })
      window.addEventListener('appinstalled', function () {
        window.__installPrompt = null
        window.dispatchEvent(new Event('mjj-install-ready'))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
